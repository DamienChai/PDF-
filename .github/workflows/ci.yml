# Checks every push and pull request: types, unit tests, formatting, the production build, and
# the end-to-end tests of that build in Chromium (tests/e2e, see playwright.config.ts).
name: CI

on:
  push:
  pull_request:

# Read the code, nothing else.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # A pull request from a branch of this repository is already checked by its push.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The WebAssembly engine is built locally (engine/build.sh, needs Emscripten) and its
      # output is committed; everything below needs it.
      - name: Check that the built engine is in the repository
        run: |
          if ! ls src/engine/dist/*.wasm >/dev/null 2>&1; then
            echo "::error::src/engine/dist/*.wasm is missing. Build the engine and commit src/engine/dist."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Roboto and Noto Sans SC, as on a Pixel phone: the layout guards measure real text widths.
      - name: Install the fonts of the target device
        run: |
          sudo apt-get install -y --no-install-recommends fonts-roboto fonts-noto-cjk
          mkdir -p ~/.config/fontconfig
          cp tests/e2e/support/fonts.conf ~/.config/fontconfig/fonts.conf
          fc-cache -f
          fc-match system-ui

      # Builds once more by itself and serves that build (see `webServer` in playwright.config.ts).
      - name: End-to-end tests
        run: npm run e2e -- --trace off

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
