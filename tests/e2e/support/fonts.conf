<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fonts for the end-to-end tests on a bare Linux machine (the CI workflow copies this file to
  ~/.config/fontconfig/fonts.conf): the generic families the app asks for resolve to Roboto and
  Noto Sans SC, as they do on a Pixel phone, so that text has the widths the layout guards of
  tests/e2e/layout.spec.ts are meant to measure.
-->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Roboto</family><family>Noto Sans SC</family><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Roboto</family><family>Noto Sans SC</family><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Roboto Mono</family><family>Noto Sans Mono CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>ui-monospace</family>
    <prefer><family>Roboto Mono</family><family>Noto Sans Mono CJK SC</family></prefer>
  </alias>
</fontconfig>
